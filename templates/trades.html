<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Trade - Exbot DCA Bot</title>
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg-base:#0d1117; --bg-surface:#161b22; --bg-card:#1c2333; --border-soft:rgba(99,110,140,.18); --accent-indigo:#6c63ff; --text-primary:#e2e8f0; --text-secondary:#94a3b8; --shadow-card:0 4px 24px rgba(0,0,0,.35); --radius-lg:14px; --radius-md:10px; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-base);
            background-image: radial-gradient(ellipse 80% 50% at 20% -10%, rgba(108,99,255,.12), transparent 60%), radial-gradient(ellipse 60% 40% at 80% 110%, rgba(56,178,172,.08), transparent 60%);
            color: var(--text-primary);
            min-height: 100vh;
            padding-bottom: 50px;
        }

        .dashboard-container {
            max-width: 1240px;
            margin: 0 auto;
            padding-top: 30px;
        }

        .card {
            background: var(--bg-card); border: 1px solid var(--border-soft);
            border-radius: var(--radius-lg); box-shadow: var(--shadow-card);
            margin-bottom: 20px;
        }

        .card-header {
            background: transparent !important; border-bottom: 1px solid var(--border-soft) !important;
            border-radius: var(--radius-lg) var(--radius-lg) 0 0 !important; font-weight: 600; color: var(--text-primary);
        }

        .navbar {
            background: var(--bg-surface) !important; border: 1px solid var(--border-soft); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); padding: 12px 20px;
        }

        .navbar-brand { color: var(--accent-indigo) !important; font-weight: 700; letter-spacing: .04em; }
        .nav-link { color: var(--text-secondary) !important; font-size:.88rem; font-weight:500; padding:6px 14px !important; border-radius:var(--radius-md); }
        .nav-link:hover, .nav-link.active { color:var(--text-primary) !important; background:rgba(108,99,255,.14); }
        .table { --bs-table-bg: transparent; --bs-table-color: var(--text-primary); --bs-table-border-color: var(--border-soft); --bs-table-hover-bg: rgba(108,99,255,.08); --bs-table-hover-color: var(--text-primary); }
        .text-muted { color: var(--text-secondary) !important; }

        .trade-table {
            font-size: 0.9rem;
        }
    </style>
</head>

<body>
    <div class="dashboard-container">
        <!-- Navigation -->
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">
                    <i class="bi bi-robot me-2"></i>EXBOT
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="/"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="/trades"><i class="bi bi-arrow-left-right me-1"></i>
                                Riwayat Trade</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/settings"><i class="bi bi-gear me-1"></i>Settings</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/logs"><i class="bi bi-file-text me-1"></i>Logs</a>
                        </li>
                        <li class="nav-item" id="nav-admin" style="display: none;">
                            <a class="nav-link text-warning" href="/admin"><i class="bi bi-shield-lock me-1"></i>Admin</a>
                        </li>
                        <li class="nav-item" id="nav-user" style="display: none;">
                            <a class="nav-link" href="#"><i class="bi bi-person me-1"></i><span id="username-display"></span></a>
                        </li>
                        <li class="nav-item" id="nav-logout" style="display: none;">
                            <a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- Trades Card -->
        <div class="card">
            <div class="card-header bg-info text-white d-flex justify-content-between align-items-center">
                <span><i class="bi bi-clock-history me-2"></i>Riwayat Semua Trade</span>
                <div class="d-flex align-items-center gap-2">
                    <select id="botSelector" class="form-select form-select-sm" style="min-width:220px"
                        aria-label="Pilih bot"></select>
                    <span class="badge bg-light text-dark" id="tradeCount">0 trade(s)</span>
                </div>
            </div>
            <div class="card-body" id="tradesContent">
                <div class="text-center text-muted py-5">
                    <div class="spinner-border" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-2">Memuat data trade...</p>
                </div>
            </div>
        </div>

        <!-- Back Button -->
        <div class="text-center">
            <a href="/" class="btn btn-outline-primary">
                <i class="bi bi-arrow-left me-1"></i>Kembali ke Dashboard
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap/5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.navbar-toggler[data-bs-target]').forEach(button => {
                button.addEventListener('click', () => {
                    if (window.bootstrap?.Collapse) return;
                    const target = document.querySelector(button.dataset.bsTarget);
                    if (!target) return;
                    const opened = target.classList.toggle('show');
                    button.setAttribute('aria-expanded', String(opened));
                });
            });
        });
    </script>
    <script>
        (async function requireSession() {
            try {
                const result = await (await fetch('/api/auth/me')).json();
                if (!result.success) throw new Error('Invalid session');
                const user = result.data || result.user;
                if (user) {
                    const navUser = document.getElementById('nav-user');
                    const usernameDisplay = document.getElementById('username-display');
                    const navLogout = document.getElementById('nav-logout');
                    const navAdmin = document.getElementById('nav-admin');
                    if (navUser) navUser.style.display = 'block';
                    if (usernameDisplay) usernameDisplay.textContent = user.username;
                    if (navLogout) navLogout.style.display = 'block';
                    if (user.is_admin && navAdmin) navAdmin.style.display = 'block';
                }
            } catch (_) { window.location.replace('/login'); }
        })();

        function logout() {
            fetch('/api/auth/logout', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' }
            }).then(() => {
                window.location.href = '/login';
            });
        }

        function formatRupiah(num) {
            return new Intl.NumberFormat('id-ID', { maximumFractionDigits: 0 }).format(num);
        }

        function formatTime(isoString) {
            const date = new Date(isoString);
            return date.toLocaleString('id-ID', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        function loadTrades(botId) {
            const query = botId ? `?bot_id=${encodeURIComponent(botId)}` : '';
            document.getElementById('tradesContent').innerHTML =
                '<div class="text-center text-muted py-5"><div class="spinner-border" role="status"></div><p class="mt-2">Memuat data trade...</p></div>';
            return fetch('/api/trades' + query)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('tradesContent');
                const countBadge = document.getElementById('tradeCount');

                if (data.success && data.data.length > 0) {
                    const trades = data.data;
                    countBadge.textContent = trades.length + ' trade(s)';

                    let html = '<div class="table-responsive"><table class="table table-hover trade-table">';
                    html += '<thead><tr><th>#</th><th>Waktu</th><th>Eksekusi</th><th>Harga (IDR)</th><th>Jumlah (IDR)</th>';
                    html += '<th>Crypto</th><th>Fee</th><th>Realized P/L</th><th>Order ID</th><th>Mode</th></tr></thead><tbody>';

                    trades.forEach((trade, index) => {
                        const time = formatTime(trade.timestamp);
                        const price = formatRupiah(trade.price);
                        const amount = formatRupiah(trade.amount_idr);
                        const crypto = (trade.crypto_amount || 0).toFixed(8);
                        const isSell = String(trade.type || '').toLowerCase() === 'sell';
                        const tradeType = String(trade.trade_type || trade.type || '-').replaceAll('_', ' ').toUpperCase();
                        const execution = '<span class="badge ' + (isSell ? 'bg-danger' : 'bg-success') + '">' + tradeType + '</span>';
                        const fee = formatRupiah(Number(trade.fee) || 0);
                        const realized = Number(trade.realized_profit) || 0;
                        const profit = isSell
                            ? '<span class="' + (realized >= 0 ? 'text-success' : 'text-danger') + '">' +
                              (realized >= 0 ? '+' : '') + 'Rp ' + formatRupiah(realized) +
                              '<small class="d-block">' + (Number(trade.realized_profit_percent) || 0).toFixed(2) + '%</small></span>'
                            : '<span class="text-muted">-</span>';
                        const orderId = trade.order_id ? '<small class="text-muted">' + trade.order_id.substring(0, 12) + '...</small>' : '<span class="text-muted">-</span>';
                        const mode = trade.dry_run
                            ? '<span class="badge bg-secondary">DRY RUN</span>'
                            : '<span class="badge bg-success">LIVE</span>';

                        html += '<tr>';
                        html += '<td>' + (index + 1) + '</td>';
                        html += '<td>' + time + '</td>';
                        html += '<td>' + execution + '</td>';
                        html += '<td>Rp ' + price + '</td>';
                        html += '<td>Rp ' + amount + '</td>';
                        html += '<td>' + crypto + '</td>';
                        html += '<td>Rp ' + fee + '</td>';
                        html += '<td>' + profit + '</td>';
                        html += '<td>' + orderId + '</td>';
                        html += '<td>' + mode + '</td>';
                        html += '</tr>';
                    });

                    html += '</tbody></table></div>';
                    container.innerHTML = html;
                } else {
                    container.innerHTML = '<div class="text-center text-muted py-5">' +
                        '<i class="bi bi-inbox" style="font-size: 4rem;"></i>' +
                        '<h4 class="mt-3">Belum ada riwayat trade</h4>' +
                        '<p>Mulai trading untuk melihat riwayat di sini.</p>' +
                        '<a href="/" class="btn btn-primary mt-2">' +
                        '<i class="bi bi-arrow-left me-1"></i>Kembali ke Dashboard</a>' +
                        '</div>';
                }
            })
            .catch(error => {
                console.error('Error loading trades:', error);
                document.getElementById('tradesContent').innerHTML =
                    '<div class="text-center text-muted py-5">' +
                    '<i class="bi bi-exclamation-triangle" style="font-size: 3rem;"></i>' +
                    '<p class="mt-2">Gagal memuat data trade</p>' +
                    '</div>';
            });
        }

        async function initializeTradeHistory() {
            try {
                const response = await fetch('/api/chart-options');
                const result = await response.json();
                const selector = document.getElementById('botSelector');
                const bots = result.success && Array.isArray(result.data) ? result.data : [];
                selector.replaceChildren(...bots.map(bot => {
                    const option = document.createElement('option');
                    option.value = bot.id;
                    option.textContent = `${bot.name} · ${(bot.pair || '').toUpperCase()} · ${bot.dry_run ? 'DRY' : 'LIVE'}`;
                    return option;
                }));
                selector.disabled = bots.length === 0;
                selector.addEventListener('change', () => loadTrades(selector.value));
                await loadTrades(bots[0]?.id || '');
            } catch (error) {
                console.error('Error loading bot list:', error);
                await loadTrades('');
            }
        }

        initializeTradeHistory();
    </script>
</body>

</html>
