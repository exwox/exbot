<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Exbot DCA Bot</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #0d1117;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .login-card {
            background: #1c2333;
            border: 1px solid rgba(99, 110, 140, 0.18);
            border-radius: 14px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
        }

        .login-card:hover {
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35), 0 0 20px rgba(108, 99, 255, 0.15);
        }

        .form-control {
            background: #161b22;
            border: 1px solid rgba(99, 110, 140, 0.18);
            color: #e2e8f0;
        }

        .form-control:focus {
            background: #161b22;
            border-color: #6c63ff;
            color: #e2e8f0;
            box-shadow: 0 0 0 0.2rem rgba(108, 99, 255, 0.25);
        }

        .btn-login {
            background: #6c63ff;
            border: none;
            border-radius: 10px;
        }

        .btn-login:hover {
            background: #7a74ff;
        }

        .text-accent {
            color: #6c63ff;
        }

        .error-msg {
            color: #f87171;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card login-card">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <h4 class="text-accent fw-bold mb-0">EXBOT DCA BOT</h4>
                            <p class="text-secondary small">Multi Account Dashboard</p>
                        </div>
                        {% if error %}
                        <div class="alert alert-danger py-2 mb-3">{{ error }}</div>
                        {% endif %}
                        <form method="POST" action="/login">
                            <div class="mb-3">
                                <label class="form-label text-secondary small">Username</label>
                                <input type="text" name="username" class="form-control" placeholder="Masukkan username"
                                    required autofocus>
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-secondary small">Password</label>
                                <input type="password" name="password" class="form-control"
                                    placeholder="Masukkan password" required>
                            </div>
                            <button type="submit" class="btn btn-login text-white w-100 py-2 mb-3">Login</button>
                        </form>
                        <div class="text-center">
                            <p class="text-secondary small mb-0">Belum punya akun?</p>
                            <a href="/register" class="text-accent small text-decoration-none">Daftar di sini</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
</arg_value>
</write_to_file>
</tool_call>
